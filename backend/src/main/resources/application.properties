spring.config.import=optional:file:./.env.tumi.local[.properties]
server.address=${BACKEND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
astra.radiation.archive=${RADIATION_ARCHIVE:./data/radlab}
astra.radiation.source-time-zone=${RADLAB_SOURCE_TIME_ZONE:UTC}
astra.cors.origins=${FRONTEND_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
astra.tumi.public-origin=${TUMI_PUBLIC_ORIGIN:}
astra.tumi.public-daily-limit=${TUMI_PUBLIC_DAILY_LIMIT:100}
